<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t2 d2">
  <title id="t2">Sequence: create habit and persist</title>
  <desc id="d2">POST with CSRF through validation, model creation, atomic save, redirect to detail.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2d3748"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <polygon points="8 0, 0 4, 8 8" fill="#718096"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1a202c">Figure B - Create habit and persist (happy path)</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1a202c">
    <text x="80" y="72" text-anchor="middle" font-weight="700">Browser</text>
    <line x1="80" y1="78" x2="80" y2="360" stroke="#cbd5e0" stroke-width="2"/>
    <text x="260" y="72" text-anchor="middle" font-weight="700">Flask routes</text>
    <line x1="260" y1="78" x2="260" y2="360" stroke="#cbd5e0" stroke-width="2"/>
    <text x="440" y="72" text-anchor="middle" font-weight="700">Validation</text>
    <line x1="440" y1="78" x2="440" y2="360" stroke="#cbd5e0" stroke-width="2"/>
    <text x="610" y="72" text-anchor="middle" font-weight="700">Models</text>
    <line x1="610" y1="78" x2="610" y2="360" stroke="#cbd5e0" stroke-width="2"/>
    <text x="790" y="72" text-anchor="middle" font-weight="700">Storage / FS</text>
    <line x1="790" y1="78" x2="790" y2="360" stroke="#cbd5e0" stroke-width="2"/>
  </g>

  <path d="M 80 100 L 260 100" stroke="#2d3748" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
  <text x="170" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4a5568">POST /habits + csrf_token</text>

  <path d="M 260 128 L 440 128" stroke="#2d3748" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
  <text x="350" y="122" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4a5568">validate_csrf + validate_habit_fields</text>

  <path d="M 440 156 L 260 156" stroke="#718096" stroke-width="1.5" marker-end="url(#arrD)" fill="none"/>
  <text x="350" y="151" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#718096">ok / bounded fields</text>

  <path d="M 260 184 L 610 184" stroke="#2d3748" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
  <text x="435" y="178" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4a5568">Habit.new(...)</text>

  <path d="M 260 212 L 790 212" stroke="#2d3748" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
  <text x="525" y="206" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4a5568">save_store / temp JSON + os.replace</text>

  <path d="M 790 240 L 260 240" stroke="#718096" stroke-width="1.5" marker-end="url(#arrD)" fill="none"/>
  <text x="525" y="235" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#718096">persisted atomically</text>

  <path d="M 260 268 L 80 268" stroke="#718096" stroke-width="1.8" marker-end="url(#arrD)" fill="none"/>
  <text x="170" y="263" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#4a5568">302 Location to /habits/{id}</text>

  <text x="460" y="384" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#718096">Exercised end-to-end in tests/test_integration.py (create / disk / GET detail)</text>
</svg>
